name: enterprise_core
description: "Shared core package for Flutter enterprise apps."
version: 0.1.0
homepage:

# We need to define that this package is a workspace package
# resolution: workspace
publish_to: none
repository: https://github.com/kamransaeb/flutter-enterprise-packages

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  dartz: ^0.10.1
  dio: ^5.10.0
  enterprise_logger:
    git:
      url: https://github.com/kamransaeb/flutter_enterprise_packages.git
      path: packages/enterprise_logger
      ref: v0.1.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  formz: ^0.8.0
  intl: ^0.20.2
  local_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

