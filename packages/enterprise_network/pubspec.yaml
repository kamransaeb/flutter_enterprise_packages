name: enterprise_network
description: "Shared network package for Flutter enterprise apps."
version: 0.0.1
homepage:
# We need to define that this package is a workspace package
resolution: workspace
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0  
  dio: ^5.11.0
  enterprise_core:
    path: ../enterprise_core
  enterprise_logger:
    path: ../enterprise_logger  
  flutter:
    sdk: flutter    
  internet_connection_checker_plus: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

